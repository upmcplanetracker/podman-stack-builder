name: Daily Podman Stack Builder

on:
  schedule:
    # Runs at 08:00 UTC (4 AM EST) every day
    - cron: '0 8 * * *'
  workflow_dispatch: # Allows you to manually click "Run workflow"

jobs:
  build-debs:
    runs-on: ubuntu-latest
    container:
      # Compiles inside 26.04 to perfectly match your environment
      image: ubuntu:26.04
      
    strategy:
      fail-fast: false # If one package fails, keep building the others
      matrix:
        include:
          - package: podman
            repo: containers/podman
          - package: netavark
            repo: containers/netavark
          - package: aardvark-dns
            repo: containers/aardvark-dns
          - package: conmon
            repo: containers/conmon
          - package: skopeo
            repo: containers/skopeo
          - package: crun
            repo: containers/crun

    steps:
      - name: Install Build Toolchain & Dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            git curl jq build-essential pkg-config ruby-rubygems \
            golang rustc cargo protobuf-compiler \
            libseccomp-dev libgpgme-dev libbpf-dev libsystemd-dev \
            libglib2.0-dev libyajl-dev autoconf automake libtool \
            go-md2man libcap-dev python3 python3-pip libbtrfs-dev libdevmapper-dev
          
          # Install FPM (Effing Package Manager) to easily generate .deb files
          gem install fpm

      - name: Fetch Latest GitHub Release Tag
        id: fetch_tag
        run: |
          # Fetch the latest release tag from the GitHub API
          RAW_TAG=$(curl -s https://api.github.com/repos/${{ matrix.repo }}/releases/latest | jq -r .tag_name)
          
          # Fallback: some repos push tags without formally marking a "release"
          if [ "$RAW_TAG" = "null" ] || [ -z "$RAW_TAG" ]; then
            RAW_TAG=$(curl -s https://api.github.com/repos/${{ matrix.repo }}/tags | jq -r '.[0].name')
          fi
          
          # Strip 'v' from version string (e.g., v6.0.2 -> 6.0.2)
          VERSION=$(echo $RAW_TAG | sed 's/^v//')
          
          echo "Found tag: $RAW_TAG (Version: $VERSION)"
          echo "tag=$RAW_TAG" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_ENV

      - name: Checkout Source Code
        run: |
          git clone --branch ${{ env.tag }} --depth 1 https://github.com/${{ matrix.repo }}.git build_dir

      - name: Compile and Install to Temporary Directory
        run: |
          cd build_dir
          mkdir -p dest
          
          if [ "${{ matrix.package }}" = "podman" ]; then
            make BUILDTAGS="seccomp systemd apparmor" PREFIX=/usr
            make install PREFIX=/usr DESTDIR=$(pwd)/dest
            
          elif [ "${{ matrix.package }}" = "skopeo" ]; then
            make BUILDTAGS="seccomp" PREFIX=/usr bin/skopeo
            make install PREFIX=/usr DESTDIR=$(pwd)/dest
            
          elif [ "${{ matrix.package }}" = "conmon" ]; then
            make PREFIX=/usr
            make install PREFIX=/usr DESTDIR=$(pwd)/dest
            
          elif [ "${{ matrix.package }}" = "crun" ]; then
            ./autogen.sh
            ./configure --prefix=/usr
            make
            make install DESTDIR=$(pwd)/dest
            
          elif [ "${{ matrix.package }}" = "netavark" ]; then
            make PREFIX=/usr
            make install PREFIX=/usr DESTDIR=$(pwd)/dest
            
          elif [ "${{ matrix.package }}" = "aardvark-dns" ]; then
            make PREFIX=/usr
            make install PREFIX=/usr DESTDIR=$(pwd)/dest
          fi

      - name: Build Debian Package
        run: |
          cd build_dir
          
          # Base FPM command using epoch '1:' to guarantee APT prioritizes it
          FPM_CMD="fpm -s dir -t deb -n ${{ matrix.package }} -v 1:${{ env.version }}-0local1 -C dest"
          
          # Define dependency relationships for Podman so APT doesn't break
          if [ "${{ matrix.package }}" = "podman" ]; then
            FPM_CMD="$FPM_CMD -d conmon -d crun -d netavark -d aardvark-dns"
          fi
          
          $FPM_CMD .

      - name: Upload .deb Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}-deb
          path: build_dir/*.deb
